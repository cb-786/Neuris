<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURIS Voice Tester</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #111; color: #eee; }
        button { background: #4caf50; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; display: block; margin: 0 auto 20px; }
        button.listening { background: #f44336; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { text-align: center; font-size: 14px; color: #888; margin-bottom: 20px; }
        #transcript { background: #222; padding: 15px; border-radius: 8px; min-height: 50px; margin-bottom: 20px; border: 1px solid #333; }
        pre { background: #000; padding: 15px; border-radius: 8px; overflow-x: auto; color: #0f0; font-size: 12px; border: 1px solid #333; }
    </style>
</head>
<body>

    <button id="micBtn">🎤 Start Listening</button>
    <div id="status">Ready</div>
    
    <h3>Transcript:</h3>
    <div id="transcript">...</div>

    <h3>Backend Response:</h3>
    <pre id="response">...</pre>

    <script>
        const btn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');
        const responseEl = document.getElementById('response');

        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusEl.innerText = "Error: Your browser doesn't support Web Speech API. Please use Chrome or Edge.";
            btn.style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            btn.onclick = () => {
                recognition.start();
                btn.textContent = "🛑 Listening... (Speak now)";
                btn.classList.add("listening");
                statusEl.innerText = "Recording...";
                transcriptEl.innerText = "...";
                responseEl.innerText = "...";
            };

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                transcriptEl.innerText = text;
                statusEl.innerText = "Sending to NEURIS Backend...";
                
                try {
                    const start = performance.now();
                    const res = await fetch("http://localhost:8000/api/v1/conversations/ingest", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: text })
                    });
                    
                    const data = await res.json();
                    const latency = ((performance.now() - start) / 1000).toFixed(2);
                    
                    statusEl.innerText = `✅ Backend responded in ${latency}s`;
                    responseEl.innerText = JSON.stringify(data, null, 2);
                } catch (e) {
                    statusEl.innerText = "❌ Failed to reach backend.";
                    responseEl.innerText = e.toString();
                }
            };

            recognition.onspeechend = () => {
                recognition.stop();
                btn.textContent = "🎤 Start Listening";
                btn.classList.remove("listening");
            };

            recognition.onerror = (event) => {
                statusEl.innerText = `Error: ${event.error}`;
                btn.textContent = "🎤 Start Listening";
                btn.classList.remove("listening");
            };
        }
    </script>
</body>
</html>
